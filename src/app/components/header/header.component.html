<div class="rail">
  <a href="#hero" class="rail-logo" aria-label="Home">
    <span class="led ok"></span>
    <span class="rail-logo-t">EH<span class="dot">.</span></span>
  </a>

  <nav class="rail-nav" aria-label="Primary">
    <a href="#hero" class="rail-key" title="{{ 'nav.Home' | translate }}">
      <i class="bx bx-home"></i><span>{{ 'nav.Home' | translate }}</span>
    </a>
    <a href="#about" class="rail-key" title="{{ 'nav.About' | translate }}">
      <i class="bx bx-user"></i><span>{{ 'nav.About' | translate }}</span>
    </a>
    <a href="#resume" class="rail-key" title="{{ 'nav.Resume' | translate }}">
      <i class="bx bx-file-blank"></i><span>{{ 'nav.Resume' | translate }}</span>
    </a>
    <a href="#contact" class="rail-key" title="{{ 'nav.Contact' | translate }}">
      <i class="bx bx-envelope"></i><span>{{ 'nav.Contact' | translate }}</span>
    </a>
  </nav>

  <div class="rail-controls">
    <button type="button" class="ctl-key ctl-lang" (click)="switchLang()" [title]="langService.currentLang === 'en' ? ('lang.Arabic' | translate) : ('lang.English' | translate)">
      <span *ngIf="langService.currentLang === 'en'">ع</span>
      <span *ngIf="langService.currentLang === 'ar'">EN</span>
    </button>
    <button type="button" class="ctl-key" (click)="switchDark()" title="Display mode">
      <i *ngIf="!darkMode" class="bx bx-moon"></i>
      <i *ngIf="darkMode" class="bx bx-sun"></i>
    </button>
  </div>

  <button type="button" class="rail-burger" (click)="updateStyle()" aria-label="Menu">
    <i class="bx bx-list-ul"></i>
  </button>
</div>
