<section id="facts" class="skeuo">
  <div class="wrap">
    <span class="sec-label"><span class="led ok"></span>MOD.02 // {{ 'facts.title' | translate }}</span>
    <h2 class="sec-title">{{ 'facts.title' | translate }}</h2>
    <p class="sec-sub">{{ 'facts.des' | translate }}</p>

    <div class="dark-strip stats">
      <div class="stat" *ngFor="let s of stats">
        <span class="housing dark"><i [class]="s.icon"></i></span>
        <span class="stat-num">{{ s.value().toLocaleString('en-US') }}</span>
        <span class="stat-label">{{ s.labelKey | translate }}</span>
      </div>
      <div class="strip-foot"><span class="led ok"></span><span>TELEMETRY.LIVE</span></div>
    </div>
  </div>
</section>
