<section id="skills" class="skeuo">
  <div class="wrap">
    <span class="sec-label"><span class="led"></span>MOD.03 // {{ 'skills.title' | translate }}</span>
    <h2 class="sec-title">{{ 'skills.title' | translate }}</h2>
    <p class="sec-sub">{{ 'skills.des' | translate }}</p>

    <div class="panel gauges">
      <div class="vents gauges-vents"><i></i><i></i><i></i></div>
      <div class="gauge" *ngFor="let g of gauges">
        <div class="gauge-head">
          <span class="gauge-name">{{ g.name }}</span>
          <span class="gauge-val">{{ g.pct }}%</span>
        </div>
        <div class="gauge-track" role="progressbar" [attr.aria-valuenow]="g.pct" aria-valuemin="0" aria-valuemax="100" [attr.aria-label]="g.name">
          <i [style.width.%]="g.pct"></i>
        </div>
      </div>
    </div>
  </div>
</section>
